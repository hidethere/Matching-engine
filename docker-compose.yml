services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: trades
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/Gateway/MatchingEngine.Api/MatchingEngine.Api.csproj
    command: ["MatchingEngine.Api.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/Engine/MatchingEngine.Engine/MatchingEngine.Engine.csproj
    command: ["MatchingEngine.Engine.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      - kafka

  marketdata:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/MarketData/MatchingEngine.MarketData/MatchingEngine.MarketData.csproj
    command: ["MatchingEngine.MarketData.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      - kafka

  marketmaker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/MarketMaker/MatchingEngine.MarketMaker/MatchingEngine.MarketMaker.csproj
    command: ["MatchingEngine.MarketMaker.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      - kafka

  feedhandler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/FeedHandler/MatchingEngine.FeedHandler/MatchingEngine.FeedHandler.csproj
    command: ["MatchingEngine.FeedHandler.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      - kafka

  persistence:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Services/Persistence/MatchingEngine.Persistence/MatchingEngine.Persistence.csproj
    command: ["MatchingEngine.Persistence.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__Trades: "Host=postgres;Port=5432;Database=trades;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      - kafka
      - postgres

volumes:
  pgdata: